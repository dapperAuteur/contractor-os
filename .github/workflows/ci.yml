name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Stub env vars so `next build` can finish. This repo has no Zod env
    # schema; instead, Supabase clients are created at module load (API
    # routes) and during prerender (@supabase/ssr), and both throw when the
    # URL or key is missing. These values only satisfy that check: nothing in
    # CI talks to Supabase, and the build output is never deployed.
    # Production / Preview deploys get the real values from Vercel's env.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://stub.invalid # CI stub
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-stub-anon-key # CI stub
      SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key # CI stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # This repo has no `test` script, so there is no Test step yet.
      # Possible follow-up: run the existing node:test suites
      # (`test:scrub`, `test:sso`, `test:email`, `test:auth`), or add a
      # `test` script that chains them, then enable:
      # - name: Test
      #   run: npm test

      - name: Build
        run: npm run build
